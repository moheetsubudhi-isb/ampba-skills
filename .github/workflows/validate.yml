name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/validate_skills.py
      - name: Plugin manifests match the source marketplace
        run: python tools/build_marketplaces.py --check
      - name: Upload bundles match the skills
        run: python tools/build_bundles.py --check
      - name: Script self-tests
        run: for s in plugins/*/skills/*/scripts/*.py; do python "$s" --selftest; done
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  installer-unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: No assistant installed -> shared ~/.agents/skills
        run: |
          export HOME="$RUNNER_TEMP/h1"; mkdir -p "$HOME"
          PATH=/usr/bin:/bin bash install.sh --source . --yes
          test "$(ls "$HOME/.agents/skills" | wc -l | tr -d ' ')" -ge 36
          test ! -d "$HOME/.claude/skills"
      - name: Claude Code and Codex -> both folders, rerun is safe, foreign skill untouched
        run: |
          export HOME="$RUNNER_TEMP/h2"; mkdir -p "$HOME/.claude/skills/ml-data-audit" "$HOME/.codex"
          echo mine > "$HOME/.claude/skills/ml-data-audit/SKILL.md"
          PATH=/usr/bin:/bin bash install.sh --source . --yes
          PATH=/usr/bin:/bin bash install.sh --source . --yes
          grep -qx mine "$HOME/.claude/skills/ml-data-audit/SKILL.md"
          test -f "$HOME/.agents/skills/causal-claim-check/SKILL.md"
          PATH=/usr/bin:/bin bash install.sh --check | grep -q "skills ("
          PATH=/usr/bin:/bin bash install.sh --uninstall
          test ! -d "$HOME/.agents/skills/causal-claim-check"
          grep -qx mine "$HOME/.claude/skills/ml-data-audit/SKILL.md"
      - name: A bad option explains itself
        run: |
          out="$(bash install.sh --nope 2>&1 || true)"
          echo "$out" | grep -q "What to do"
  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 install, rerun, check, uninstall
        shell: powershell
        run: |
          $h = Join-Path $env:RUNNER_TEMP "h1"
          New-Item -ItemType Directory -Force -Path (Join-Path $h ".claude") | Out-Null
          .\install.ps1 -Source . -Yes -HomeDir $h
          .\install.ps1 -Source . -Yes -HomeDir $h
          if (-not (Test-Path (Join-Path $h ".claude\skills\causal-claim-check\SKILL.md"))) { throw "not installed" }
          .\install.ps1 -Check -HomeDir $h
          .\install.ps1 -Uninstall -HomeDir $h
          if (Test-Path (Join-Path $h ".claude\skills\causal-claim-check")) { throw "not removed" }
      - name: PowerShell 7 install into the shared folder
        shell: pwsh
        run: |
          $h = Join-Path $env:RUNNER_TEMP "h2"
          New-Item -ItemType Directory -Force -Path $h | Out-Null
          .\install.ps1 -Source . -Yes -HomeDir $h -Target (Join-Path $h ".agents\skills")
          if (-not (Test-Path (Join-Path $h ".agents\skills\ml-data-audit\SKILL.md"))) { throw "not installed" }
  download-routes:
    # The one-liners people paste, fetched from GitHub exactly as published.
    if: github.ref == 'refs/heads/main'
    needs: [installer-unix, installer-windows]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: curl | bash from GitHub
        if: runner.os != 'Windows'
        run: |
          export HOME="$RUNNER_TEMP/h"; mkdir -p "$HOME/.claude"
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | PATH=/usr/bin:/bin bash -s -- --yes --ref ${{ github.sha }}
          test -f "$HOME/.claude/skills/causal-claim-check/SKILL.md"
      - name: irm | iex form from GitHub
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $h = Join-Path $env:RUNNER_TEMP "h"
          New-Item -ItemType Directory -Force -Path $h | Out-Null
          & ([scriptblock]::Create((irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1"))) -Yes -HomeDir $h -Ref ${{ github.sha }}
          if (-not (Test-Path (Join-Path $h ".agents\skills\causal-claim-check\SKILL.md"))) { throw "not installed" }
      - name: Every chat-tool bundle downloads
        shell: bash
        run: |
          for f in causal-claim-check.zip microsoft-365/causal-claim-check.zip text/causal-claim-check.md; do
            curl -fsSL -o /dev/null "https://github.com/${{ github.repository }}/raw/${{ github.sha }}/dist/$f"
          done
  claude-marketplace:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Marketplace adds and every toolkit installs
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/cc"
          claude plugin marketplace add ./
          for t in $(python3 -c "import json;print(' '.join(p['name'] for p in json.load(open('.claude-plugin/marketplace.json'))['plugins']))"); do
            claude plugin install "$t@business-analytics-skills"
          done
          claude plugin list | grep -c enabled
